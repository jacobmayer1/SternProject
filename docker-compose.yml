services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CHROMA_PATH: /app/chroma_data
    ports: ["8000:8000"]
    volumes: ["chroma_data:/app/chroma_data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports: ["5173:80"]   # same origin as `npm run dev`, so the CORS setting fits both
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data:
